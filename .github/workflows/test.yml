name: Test

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra gui

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run tests
        # A virtual X display is required even for "offscreen" Qt tests,
        # since pynput's Linux backend probes for a real X connection at
        # import time regardless of Qt's platform plugin.
        run: xvfb-run -a uv run pytest
