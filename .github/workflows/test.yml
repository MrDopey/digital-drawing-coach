name: Test

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra gui

      - name: Install Xvfb and Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libglx0 libopengl0 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xkb1 libx11-xcb1 libxtst6 libxi6 libdbus-1-3

      - name: Run tests
        # A virtual X display is required even for "offscreen" Qt tests,
        # since pynput's Linux backend probes for a real X connection at
        # import time regardless of Qt's platform plugin.
        run: xvfb-run -a uv run pytest
