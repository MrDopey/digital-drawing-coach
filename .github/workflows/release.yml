name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            script: bash scripts/package.sh
            zip_glob: drawing-coach-*-linux.zip
          - os: windows-latest
            platform: windows
            script: pwsh scripts/package.ps1
            zip_glob: drawing-coach-*-windows.zip
          - os: macos-latest
            platform: macos
            script: bash scripts/package.sh
            zip_glob: drawing-coach-*-macos.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install ".[gui]"
          pip install ".[windows]" || true
          pip install ".[macos]" || true
        shell: bash

      - name: Build binary
        run: ${{ matrix.script }}
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: ${{ matrix.zip_glob }}
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: binary-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true

  publish-packages:
    name: Publish OCI Packages
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: binary-*
          merge-multiple: true

      - uses: oras-project/setup-oras@v1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push binaries to GHCR
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          OWNER="${{ github.repository_owner }}"
          for ZIP in artifacts/*.zip; do
            FILENAME="$(basename "$ZIP")"
            # Derive platform tag from filename
            if [[ "$FILENAME" == *linux* ]]; then PLAT=linux
            elif [[ "$FILENAME" == *windows* ]]; then PLAT=windows
            else PLAT=macos
            fi
            oras push \
              "ghcr.io/${OWNER}/drawing-coach-binaries:${PLAT}-${VERSION}" \
              "${ZIP}:application/zip"
          done

  build-docker:
    name: Build and Push Docker Image
    needs: []
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/drawing-coach
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
