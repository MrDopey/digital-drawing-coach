name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump size for the next release"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  build-binaries:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            script: bash scripts/package.sh
            zip_glob: digital-drawing-coach-*-linux.zip
          - os: windows-latest
            platform: windows
            script: pwsh scripts/package.ps1
            zip_glob: digital-drawing-coach-*-windows.zip
          - os: macos-latest
            platform: macos
            script: bash scripts/package.sh
            zip_glob: digital-drawing-coach-*-macos.zip

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install ".[gui]"
          pip install ".[windows]" || true
          pip install ".[macos]" || true
        shell: bash

      - name: Build binary
        run: ${{ matrix.script }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform }}
          path: ${{ matrix.zip_glob }}
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          pattern: binary-*
          merge-multiple: true

      - name: Determine current version
        id: version
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Determine previous release
        id: previous
        run: |
          PREV_JSON="$(gh release view --json tagName,createdAt 2>/dev/null || true)"
          if [[ -n "${PREV_JSON}" ]]; then
            PREV_TAG="$(echo "${PREV_JSON}" | python -c 'import json,sys; print(json.load(sys.stdin)["tagName"])')"
            PREV_DATE="$(echo "${PREV_JSON}" | python -c 'import json,sys; print(json.load(sys.stdin)["createdAt"])')"
          else
            PREV_TAG=""
            PREV_DATE="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.created_at')"
          fi
          echo "tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          echo "date=${PREV_DATE}" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREV_TAG: ${{ steps.previous.outputs.tag }}
          PREV_DATE: ${{ steps.previous.outputs.date }}
        run: |
          MERGED_PR_COUNT="$(gh pr list --state merged --search "merged:>=${PREV_DATE}" --json number --jq 'length')"
          if [[ "${MERGED_PR_COUNT}" -gt 0 ]]; then
            gh release create "v${VERSION}" artifacts/*.zip --generate-notes
          else
            if [[ -n "${PREV_TAG}" ]]; then
              git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" > notes.md
            else
              git log --pretty=format:"- %s (%h)" > notes.md
            fi
            gh release create "v${VERSION}" artifacts/*.zip --notes-file notes.md
          fi

  bump-version:
    name: Bump version on main
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Bump version
        run: python scripts/bump_version.py "${{ inputs.bump }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump version for next release"
          git push origin main
