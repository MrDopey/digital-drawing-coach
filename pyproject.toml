[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drawing-coach"
version = "0.1.0"
description = "AI-powered digital drawing coach that watches your canvas and gives real-time feedback"
requires-python = ">=3.11"
dependencies = [
    "mss>=9.0",
    "Pillow>=10.0",
    "numpy>=1.26",
    "litellm>=1.40",
    "keyring>=24.0",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.6", "pynput>=1.7"]
windows = ["pywin32>=306"]
macos = ["pyobjc-framework-Quartz>=10.0", "pyobjc-framework-AppKit>=10.0"]
dev = ["pytest>=8.0", "pytest-qt>=4.4"]

[project.scripts]
drawing-coach = "drawing_coach.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drawing_coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
