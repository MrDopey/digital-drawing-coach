schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

rules:
  proposal:
    - For any change that adds or modifies a dialog or panel, explicitly state resize behaviour: which widgets expand, minimum sizes, and whether a scroll area is needed
  tasks:
    - Always include a final task group "Documentation" with a task to update README.md from a developer's perspective
    - Always include in the "Documentation" task group a task to update .claude/CLAUDE.md based on any plausible memory.md changes implied by the spec
    - Always include in the "Documentation" task group a task to review openspec/config.yaml and propose changes only if the spec reveals a clear, recurring gap in the current rules — apply a high threshold since this config governs all future specs
    - Always include a final verification task to run `uv run pytest` and confirm all tests pass
